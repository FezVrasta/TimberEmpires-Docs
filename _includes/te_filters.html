{%- comment -%}The roughen filters that give the lines their hand-drawn wobble{%- endcomment -%}
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="te-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="4" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="te-rough-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="11" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="te-rough-pic" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="1" seed="23" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="te-rough-line" x="-2%" y="-400%" width="104%" height="900%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="1" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </defs>
</svg>
