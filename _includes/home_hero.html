<section class="te-hero" aria-label="Timber Empires">
  {%- if site.halloween %}
  <img class="te-hero-art" src="{{ '/assets/images/halloween.webp' | relative_url }}" srcset="{{ '/assets/images/halloween-1280.webp' | relative_url }} 1280w, {{ '/assets/images/halloween.webp' | relative_url }} 1920w" sizes="100vw" alt="">
  {%- else %}
  <img class="te-hero-art" src="{{ '/assets/images/empires.webp' | relative_url }}" srcset="{{ '/assets/images/empires-1280.webp' | relative_url }} 1280w, {{ '/assets/images/empires.webp' | relative_url }} 2560w" sizes="100vw" alt="">
  {%- endif %}
  {% include te_embers.html %}
  {% include te_header.html %}
  {%- if site.halloween %}
  <a class="te-hbadge" href="{{ '/playing/horde.html' | relative_url }}">
    <img src="{{ '/assets/images/raccoon.webp' | relative_url }}" alt="">
    <span class="te-hbadge-text">
      <span class="te-hbadge-tag">Halloween</span>
      <span class="te-hbadge-title">Horde mode is out</span>
      <span class="te-hbadge-sub">Play it now</span>
    </span>
  </a>
  {%- endif %}
  <div class="te-hero-top">
    <h1 class="te-hero-logo"><img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Timber Empires"></h1>
    <div class="te-hero-slogan"><div class="te-plaque-rule"><i></i><p class="te-plaque">One river. Too many beavers.</p><i></i></div></div>
  </div>
  <div class="te-band te-hero-bottom">
    <div class="te-hero-bottom-inner">
      <p class="te-slogan">Build your empire. Burn theirs.</p>
      <div class="te-actions">
        <a class="te-btn ghost" href="{{ '/getting-started.html' | relative_url }}">Getting started</a>
        {% include te_get.html %}
      </div>
    </div>
  </div>
</section>
