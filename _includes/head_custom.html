<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ '/assets/images/icon.png' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/thumbnail.jpg' | absolute_url }}">
<script>
  /* Dark when the system is, unless the reader picked one with the header button */
  (function () {
    var light = '{{ "/assets/css/just-the-docs-default.css" | relative_url }}';
    var dark = '{{ "/assets/css/just-the-docs-timber-dark.css" | relative_url }}';
    var sheet = document.querySelector('link[rel="stylesheet"]');
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function picked() { try { return localStorage.getItem('te-theme'); } catch (e) { return null; } }
    function apply() {
      var theme = picked() || (media.matches ? 'dark' : 'light');
      sheet.setAttribute('href', theme === 'dark' ? dark : light);
      document.documentElement.dataset.theme = theme;
    }
    apply();
    media.addEventListener('change', function () { if (!picked()) apply(); });
    window.teToggleTheme = function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('te-theme', next); } catch (e) {}
      apply();
    };
  })();
  /* The theme centers the current page in the menu with scrollIntoView, which would scroll the whole page too */
  (function () {
    var native = Element.prototype.scrollIntoView;
    Element.prototype.scrollIntoView = function (options) {
      var bar = this.closest && this.closest('.te-sidebar');
      if (!bar) return native.call(this, options);
      bar.scrollTop += this.getBoundingClientRect().top - bar.getBoundingClientRect().top - bar.clientHeight / 2;
    };
  })();
</script>
